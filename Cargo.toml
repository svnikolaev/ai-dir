[package]
name = "ai-dir"
version = "0.4.1"
edition = "2024"
description = "Fast project file description tool with LLM and pattern modes"
authors = ["Serg Nikolaev <s.nikolaev@nklv.su>"]
license = "MIT"
repository = "https://github.com/svnikolaev/ai-dir.git"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.0", features = ["derive"] }
colored = "2.0"
dirs = "5.0"
ignore = "0.4"
once_cell = "1.19"
regex = "1.10"
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
walkdir = "2.4"

[dev-dependencies]
tempfile = "3.8"
mockito = "1.0"
assert_cmd = "2.0"
predicates = "3.0"