[package]
name = "ai-dir"
version = "0.5.3"
edition = "2024"
description = "Fast project file description tool with LLM and pattern modes"
authors = ["Serg Nikolaev <s.nikolaev@nklv.su>"]
license = "MIT"
repository = "https://github.com/svnikolaev/ai-dir.git"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.0", features = ["derive"] }
colored = "2.0"
dirs = "5.0"
ignore = "0.4"
once_cell = "1.19"
proc-macro2 = { version = "1.0", features = ["span-locations"] } 
regex = "1.10"
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full", "visit", "extra-traits"] }
thiserror = "1.0"
toml = "0.8"
walkdir = "2.4"

[dev-dependencies]
assert_cmd = "2.0"
mockito = "1.0"
predicates = "3.0"
tempfile = "3.8"
